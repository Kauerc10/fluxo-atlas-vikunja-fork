name: Atlas secret scan

on:
  pull_request:
    branches: [atlas-public]
  push:
    branches: [atlas-public]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and run Gitleaks
        shell: bash
        env:
          UPSTREAM_BASE: 5619c4a9f66ddfc13f7bbba24ada07c3e82ae7a0
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          git merge-base --is-ancestor "$UPSTREAM_BASE" HEAD
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact=100 --log-opts "$UPSTREAM_BASE..HEAD" .
